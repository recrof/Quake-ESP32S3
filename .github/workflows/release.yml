# Builds the ESP32-S3 firmware of each board and publishes a GitHub release when a vX.Y tag is pushed
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    defaults:
      run:
        shell: bash
        working-directory: QuakeESP32S3
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build-l2 -DBOARD=BOARD_WIO_TRACKER_L2 build
          idf.py -B build-tdeck -DBOARD=BOARD_LILYGO_TDECK build
          idf.py -B build-m9 -DBOARD=BOARD_THINKNODE_M9 build
          idf.py -B build-xiao -DBOARD=BOARD_XIAO_ESP32S3 build

      - name: Merge the images
        run: |
          . "$IDF_PATH/export.sh"
          tools/merge.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: QuakeESP32S3/dist/*.bin
          generate_release_notes: true
          body: |
            ESP32-S3 firmware images, to flash at 0x0 (see the quick start in the readme):

            ```
            esptool.py --chip esp32s3 write_flash 0x0 QuakeESP32S3-wio-tracker-l2.bin
            ```

            - `QuakeESP32S3-wio-tracker-l2.bin`: Seeed Wio Tracker L2
            - `QuakeESP32S3-t-deck.bin`: LilyGO T-Deck
            - `QuakeESP32S3-thinknode-m9.bin`: Elecrow ThinkNode M9
            - `QuakeESP32S3-xiao-esp32s3.bin`: Seeed XIAO ESP32S3 with an ILI9341 module
